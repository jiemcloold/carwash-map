            provinceName: "北京市",
            cityName: "北京市",
            countyName: "",
            serviceType: "01",
            subServiceType: "0104",
            orderFlag: 1
        };

        function initMap() {
            if (!window.AMap) {
                document.getElementById('infoText').innerHTML = '地图加载失败，请检查网络';
                document.getElementById('loading').classList.add('hidden');
                return;
            }

            map = new AMap.Map('map', {
                zoom: 12,
                center: [116.407526, 39.904030],
                mapStyle: 'amap://styles/normal'
            });

            getCurrentLocation();
        }

        function ensureDrivingPlugin() {
            if (drivingPluginPromise) {
                return drivingPluginPromise;
            }

            drivingPluginPromise = new Promise((resolve, reject) => {
                const timer = setTimeout(() => reject(new Error('路线插件加载超时')), 8000);
                AMap.plugin('AMap.Driving', () => {
                    clearTimeout(timer);
                    resolve();
                });
            });

            return drivingPluginPromise;
        }

        function getCurrentLocation() {
            if (!navigator.geolocation) {
                document.getElementById('infoText').innerHTML = '浏览器不支持定位，显示全部商家';
                showShops({ skipRouteEstimate: true });
                document.getElementById('loading').classList.add('hidden');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                position => {
                    const gcjCoords = wgs84ToGcj02(position.coords.longitude, position.coords.latitude);
                    myLocation = {
                        lat: gcjCoords.lat,
                        lng: gcjCoords.lng
                    };

                    new AMap.Marker({
                        position: [myLocation.lng, myLocation.lat],
                        content: '<div class="location-marker"></div>',
                        offset: new AMap.Pixel(-15, -15),
                        zIndex: 200,
                        map
                    });

                    map.setCenter([myLocation.lng, myLocation.lat]);
                    map.setZoom(14);
                    showShops();
                    document.getElementById('loading').classList.add('hidden');
                },
                error => {
                    console.error('定位失败:', error);
                    let errorMsg = '定位失败';

                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = '请允许位置权限';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = '位置信息不可用';
                            break;
                        case error.TIMEOUT:
                            errorMsg = '定位超时';
                            break;
                    }

                    document.getElementById('infoText').innerHTML = errorMsg + '，显示全部商家';
                    showShops({ skipRouteEstimate: true });
                    if (markers.length > 0) {
                        map.setFitView(markers, false, [110, 40, 40, 40]);
                    }
                    document.getElementById('loading').classList.add('hidden');
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        function showShops(options = {}) {
            markers.forEach(marker => marker.setMap(null));
            markers = [];

            const sortedShops = buildSortedShops();
            recommendedShop = pickRecommendedShop(sortedShops);
            updateInfoText(sortedShops, Boolean(options.estimatingRoutes));

            sortedShops.forEach(shop => {
                const isRecommended = recommendedShop && getShopKey(shop) === getShopKey(recommendedShop);
                const marker = new AMap.Marker({
                    position: [shop.lng, shop.lat],
                    icon: createShopMarkerIcon(isRecommended),
                    offset: new AMap.Pixel(-15, -40),
                    zIndex: isRecommended ? 120 : 90,
                    map
                });

                const infoWindow = new AMap.InfoWindow({
                    content: buildInfoWindowContent(shop),
                    offset: new AMap.Pixel(0, -38)
                });

                marker.on('click', () => {
                    infoWindow.open(map, [shop.lng, shop.lat]);
                });

                markers.push(marker);
            });

            if (myLocation && AUTO_ROUTE_RANK_ENABLED && routeServiceAvailable && !options.skipRouteEstimate) {
                rankNearbyByDrivingRoute(sortedShops);
            }
        }

        function buildSortedShops() {
            const mappedShops = shops.map(shop => {
                const distance = myLocation
                    ? calculateDistance(myLocation.lat, myLocation.lng, shop.lat, shop.lng)
                    : 0;
                const routeSummary = routeSummaries.get(getShopKey(shop)) || {};

                return {
                    ...shop,
                    distance,
                    routeDistance: routeSummary.routeDistance,
                    routeDuration: routeSummary.routeDuration,
                    routeFailed: routeSummary.routeFailed
                };
            });

            if (!myLocation) {
                return mappedShops;
            }

            return mappedShops.sort((a, b) => {
                const aHasRoute = Number.isFinite(a.routeDuration);
                const bHasRoute = Number.isFinite(b.routeDuration);

                if (aHasRoute && bHasRoute) {
                    return a.routeDuration - b.routeDuration;
                }
                if (aHasRoute) {
                    return -1;
                }
                if (bHasRoute) {
                    return 1;
                }
                return a.distance - b.distance;
            });
        }

        function pickRecommendedShop(sortedShops) {
            if (!sortedShops.length) {
                return null;
            }

            const routeRanked = sortedShops
                .filter(shop => Number.isFinite(shop.routeDuration))
                .sort((a, b) => a.routeDuration - b.routeDuration);

            return routeRanked[0] || sortedShops[0];
        }

        function createShopMarkerIcon(isRecommended) {
            const fill = isRecommended ? '#ff4d4f' : '#1989fa';
            return new AMap.Icon({
                size: new AMap.Size(30, 40),
                image: markerSvgDataUrl(fill),
                imageSize: new AMap.Size(30, 40)
            });
        }

        function markerSvgDataUrl(fill) {
            const svg =
                '<svg width="30" height="40" viewBox="0 0 30 40" xmlns="http://www.w3.org/2000/svg">' +
                '<filter id="s" x="-40%" y="-30%" width="180%" height="180%">' +
                '<feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.28"/>' +
                '</filter>' +
                '<path filter="url(#s)" d="M15 1C7.3 1 1.2 7.1 1.2 14.7C1.2 25.2 15 39 15 39S28.8 25.2 28.8 14.7C28.8 7.1 22.7 1 15 1Z" fill="' + fill + '" stroke="#fff" stroke-width="2"/>' +
                '<circle cx="15" cy="14.5" r="5" fill="#fff"/>' +
                '</svg>';

            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        async function rankNearbyByDrivingRoute(sortedShops) {
            if (!routeServiceAvailable) {
                updateInfoText(sortedShops, false);
                return;
            }

            const candidates = sortedShops
                .filter(shop => !routeSummaries.has(getShopKey(shop)))
                .sort((a, b) => a.distance - b.distance)
                .slice(0, ROUTE_RANK_LIMIT);

            if (candidates.length === 0) {
                return;
            }

            const token = ++routeRankingToken;
            updateInfoText(sortedShops, true);

            try {
                await ensureDrivingPlugin();

                for (const shop of candidates) {
                    if (token !== routeRankingToken) {
                        return;
                    }

                    const summary = await searchDrivingSummary(shop);
                    routeSummaries.set(getShopKey(shop), summary);
                    if (summary.routeAuthorizationFailed) {
                        break;
                    }
                }
            } catch (error) {
                console.error('附近路线估算失败:', error);
            }

            if (token === routeRankingToken && !currentDriving) {
                showShops({ skipRouteEstimate: true });
            }
        }

        function searchDrivingSummary(shop) {
            return new Promise(resolve => {
                const driving = new AMap.Driving({
                    policy: AMap.DrivingPolicy.LEAST_TIME
                });

                driving.search(
                    new AMap.LngLat(myLocation.lng, myLocation.lat),
                    new AMap.LngLat(shop.lng, shop.lat),
                    (status, result) => {
                        const route = result && result.routes && result.routes[0];

                        if (status === 'complete' && route) {
                            resolve({
                                routeDistance: route.distance / 1000,
                                routeDuration: Math.ceil(route.time / 60)
                            });
                        } else {
                            const failure = createRouteFailure(status, result);
                            if (failure.routeAuthorizationFailed) {
                                routeServiceAvailable = false;
                                routeServiceError = failure.routeErrorMessage;
                                routeServiceErrorDetail = failure.routeErrorDetail;
                            }
                            resolve(failure);
                        }
                    }
                );
            });
        }

        function createRouteFailure(status, result) {
            const routeErrorDetail = getRouteErrorDetail(status, result);
            const routeAuthorizationFailed = isRouteAuthorizationFailure(routeErrorDetail);

            return {
                routeFailed: true,
                routeAuthorizationFailed,
                routeErrorMessage: routeAuthorizationFailed
                    ? '高德路线服务授权失败'
                    : '这家店暂时无法规划路线',
                routeErrorDetail
            };
        }

        function getRouteErrorDetail(status, result) {
            const parts = ['status=' + (status || 'unknown')];

            if (result && typeof result === 'object') {
                ['info', 'infocode', 'message'].forEach(key => {
                    if (result[key]) {
                        parts.push(key + '=' + result[key]);
                    }
                });
            }

            return parts.join('; ');
        }

        function isRouteAuthorizationFailure(detail) {
            return /INVALID_USER_KEY|INVALID_USER_DOMAIN|INVALID_USER_SCODE|USERKEY_PLAT_NOMATCH|INSUFFICIENT_PRIVILEGES|USER_KEY_RECYCLED/i.test(detail || '');
        }

        function updateInfoText(sortedShops, estimatingRoutes) {
            const infoText = document.getElementById('infoText');

            if (!shops.length) {
                infoText.innerHTML = '暂无商家数据';
                return;
            }

            if (!myLocation) {
                infoText.innerHTML = '共 ' + shops.length + ' 家洗车店';
                return;
            }

            const shop = pickRecommendedShop(sortedShops);
            if (!shop) {
                infoText.innerHTML = '共 ' + shops.length + ' 家洗车店';
                return;
            }

            if (Number.isFinite(shop.routeDuration)) {
                infoText.innerHTML =
                    '推荐: <strong>' + escapeHtml(shop.name) + '</strong>' +
                    '<div style="margin-top:4px;color:#5d6670;">驾车约 <strong>' + shop.routeDuration + '</strong> 分钟 / <strong>' +
                    shop.routeDistance.toFixed(1) + '</strong> 公里，直线 ' + formatDistance(shop.distance) + '</div>';
                return;
            }

            if (!routeServiceAvailable) {
                infoText.innerHTML =
                    '最近: <strong>' + escapeHtml(shop.name) + '</strong>（直线 ' + formatDistance(shop.distance) + '）' +
                    '<div style="margin-top:4px;color:#c05a00;">' + escapeHtml(routeServiceError || '高德路线服务授权失败') +
                    (routeServiceErrorDetail ? '（' + escapeHtml(routeServiceErrorDetail) + '）' : '') + '</div>';
                return;
            }

            infoText.innerHTML =
                (estimatingRoutes ? '正在估算附近路线: ' : '最近: ') +
                '<strong>' + escapeHtml(shop.name) + '</strong>（直线 ' + formatDistance(shop.distance) + '）';
        }

        function buildInfoWindowContent(shop) {
            const routeText = Number.isFinite(shop.routeDuration)
                ? '<div class="info-row route-summary"><span>驾车约 ' + shop.routeDuration + ' 分钟 / ' + shop.routeDistance.toFixed(1) + ' 公里</span></div>'
                : (myLocation ? '<div class="info-row route-summary"><span>直线 ' + formatDistance(shop.distance) + '</span></div>' : '');

            return `
                <div class="info-window">
                    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
                        <h3>${escapeHtml(shop.name)}</h3>
                        <button class="copy-btn" data-action="copy" data-label="店名" data-value="${encodedValue(shop.name)}">复制</button>
                    </div>
                    <div class="info-row">
                        <span>${escapeHtml(shop.address)}</span>
                        <button class="copy-btn" data-action="copy" data-label="地址" data-value="${encodedValue(shop.address)}">复制</button>
                    </div>
                    ${shop.phone ? '<div class="info-row"><span><a href="tel:' + escapeHtml(shop.phone) + '" class="info-phone">' + escapeHtml(shop.phone) + '</a></span></div>' : ''}
                    ${shop.workTime ? '<div class="info-row"><span>' + escapeHtml(shop.workTime) + '</span></div>' : ''}
                    ${routeText}
                    <button class="nav-btn" data-action="nav" data-lat="${shop.lat}" data-lng="${shop.lng}" data-name="${encodedValue(shop.name)}">高德地图导航</button>
                    ${myLocation ? `<button class="route-btn" data-action="route" data-lat="${shop.lat}" data-lng="${shop.lng}" data-name="${encodedValue(shop.name)}">显示路线</button>` : ''}
                </div>
            `;
        }

        function handleInfoWindowAction(event) {
            const button = event.target.closest('[data-action]');
            if (!button || !button.closest('.info-window')) {
                return;
            }

            const key = [
                button.dataset.action,
                button.dataset.lat || '',
                button.dataset.lng || '',
                button.dataset.name || '',
                button.dataset.value || ''
            ].join('|');
            const now = Date.now();

            if (lastInfoWindowAction.key === key && now - lastInfoWindowAction.time < 350) {
                return;
            }

            lastInfoWindowAction = { key, time: now };
            event.preventDefault();
            event.stopPropagation();

            const action = button.dataset.action;
            if (action === 'copy') {
                copyText(decodeURIComponent(button.dataset.value || ''), button.dataset.label || '');
                return;
            }

            const lat = Number(button.dataset.lat);
            const lng = Number(button.dataset.lng);
            const name = decodeURIComponent(button.dataset.name || '');

            if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
                return;
            }

            if (action === 'route') {
                showRouteTo(lat, lng, name);
            } else if (action === 'nav') {
                navigateTo(lat, lng, name);
            }
        }

        async function showRouteTo(destLat, destLng, shopName) {
            if (!myLocation) {
                showToast('无法获取当前位置');
                return;
            }

            if (!routeServiceAvailable) {
                document.getElementById('infoText').innerHTML =
                    escapeHtml(routeServiceError || '高德路线服务授权失败') +
                    (routeServiceErrorDetail ? '（' + escapeHtml(routeServiceErrorDetail) + '）' : '') +
                    '，可先使用高德地图导航';
                return;
            }

            clearCurrentRoute();
            routeRankingToken++;
            document.getElementById('infoText').innerHTML = '正在规划路线...';

            try {
                await ensureDrivingPlugin();

                currentDriving = new AMap.Driving({
                    map,
                    policy: AMap.DrivingPolicy.LEAST_TIME
                });

                currentDriving.search(
                    new AMap.LngLat(myLocation.lng, myLocation.lat),
                    new AMap.LngLat(destLng, destLat),
                    (status, result) => {
                        const route = result && result.routes && result.routes[0];

                        if (status === 'complete' && route) {
                            const routeDistance = route.distance / 1000;
                            const routeDuration = Math.ceil(route.time / 60);
                            const shop = shops.find(item =>
                                item.name === shopName &&
                                Math.abs(item.lat - destLat) < 0.000001 &&
                                Math.abs(item.lng - destLng) < 0.000001
                            );

                            if (shop) {
                                routeSummaries.set(getShopKey(shop), { routeDistance, routeDuration });
                            }

                            document.getElementById('infoText').innerHTML =
                                '前往: <strong>' + escapeHtml(shopName || '目的地') + '</strong>' +
                                '<div style="margin-top:4px;color:#5d6670;">驾车约 <strong>' + routeDuration +
                                '</strong> 分钟 / <strong>' + routeDistance.toFixed(1) + '</strong> 公里</div>';
                            document.getElementById('cancelRouteBtn').classList.remove('hidden');
                        } else {
                            const failure = createRouteFailure(status, result);

                            if (failure.routeAuthorizationFailed) {
                                routeServiceAvailable = false;
                                routeServiceError = failure.routeErrorMessage;
                                routeServiceErrorDetail = failure.routeErrorDetail;
                            }

                            document.getElementById('infoText').innerHTML =
                                escapeHtml(failure.routeErrorMessage) +
                                (failure.routeErrorDetail ? '（' + escapeHtml(failure.routeErrorDetail) + '）' : '') +
                                '，可先使用高德地图导航';
                        }
                    }
                );
            } catch (error) {
                console.error('路线规划失败:', error);
                document.getElementById('infoText').innerHTML = '路线规划失败，请使用导航功能';
            }
        }

        function cancelRoute() {
            clearCurrentRoute();
            document.getElementById('cancelRouteBtn').classList.add('hidden');
            showShops({ skipRouteEstimate: true });
        }

        function clearCurrentRoute() {
            if (currentDriving && typeof currentDriving.clear === 'function') {
                currentDriving.clear();
            }
            currentDriving = null;
        }

        function navigateTo(lat, lng, name) {
            const webUrl = buildAmapWebNavigationUrl(lat, lng, name);
            const encodedName = encodeURIComponent(name || '目的地');
            const userAgent = navigator.userAgent.toLowerCase();

            if (/iphone|ipad|ipod/.test(userAgent)) {
                openNativeAmap(
                    `iosamap://path?sourceApplication=carwash&dlat=${lat}&dlon=${lng}&dname=${encodedName}&dev=0&t=0`,
                    webUrl
                );
                return;
            }

            if (/android/.test(userAgent)) {
                openNativeAmap(
                    `androidamap://route/plan/?sourceApplication=carwash&dlat=${lat}&dlon=${lng}&dname=${encodedName}&dev=0&t=0`,
                    webUrl
                );
                return;
            }

            window.location.href = webUrl;
        }

        function buildAmapWebNavigationUrl(lat, lng, name) {
            const params = [];

            if (myLocation) {
                params.push(`from=${myLocation.lng},${myLocation.lat},${encodeURIComponent('我的位置')}`);
            }

            params.push(`to=${lng},${lat},${encodeURIComponent(name || '目的地')}`);
            params.push('mode=car');
            params.push('policy=1');
            params.push('coordinate=gaode');
            params.push('callnative=1');
            params.push('src=carwash');

            return 'https://uri.amap.com/navigation?' + params.join('&');
        }

        function openNativeAmap(nativeUrl, fallbackUrl) {
            const startedAt = Date.now();
            window.location.href = nativeUrl;

            setTimeout(() => {
                if (document.visibilityState === 'visible' && Date.now() - startedAt < 2200) {
                    window.location.href = fallbackUrl;
                }
            }, 1200);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        function copyText(text, label) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('已复制' + label + ': ' + text);
                }).catch(() => {
                    fallbackCopy(text, label);
                });
            } else {
                fallbackCopy(text, label);
            }
        }

        function fallbackCopy(text, label) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();

            try {
                document.execCommand('copy');
                showToast('已复制' + label + ': ' + text);
            } catch (err) {
                showToast('复制失败，请手动复制: ' + text);
            }

            document.body.removeChild(textarea);
        }

        function refreshShops() {
            const btn = document.getElementById('refreshBtn');
            const loading = document.getElementById('loading');

            btn.disabled = true;
            btn.textContent = '检查更新...';
            loading.classList.remove('hidden');

            fetchAllLatestShops()
                .then(allShops => {
                    if (allShops.length === 0) {
                        alert('未获取到数据，请稍后重试');
                        return;
                    }

                    const changes = compareShops(shops, allShops);
                    const hasChanges = changes.added.length > 0 ||
                                      changes.removed.length > 0 ||
                                      changes.updated.length > 0;

                    let message = '数据对比结果:\n\n';
                    message += '当前数据: ' + shops.length + ' 家\n';
                    message += '最新数据: ' + allShops.length + ' 家\n\n';

                    if (hasChanges) {
                        if (changes.added.length > 0) {
                            message += '新增: ' + changes.added.length + ' 家\n';
                            changes.added.forEach(shop => { message += '  · ' + shop.name + '\n'; });
                        }
                        if (changes.removed.length > 0) {
                            message += '\n移除: ' + changes.removed.length + ' 家\n';
                            changes.removed.forEach(shop => { message += '  · ' + shop.name + '\n'; });
                        }
                        if (changes.updated.length > 0) {
                            message += '\n信息更新: ' + changes.updated.length + ' 家\n';
                            changes.updated.forEach(shop => { message += '  · ' + shop.name + '\n'; });
                        }
                        message += '\n是否更新地图数据？';
                    } else {
                        message += '数据已是最新，无需更新';
                    }

                    if (hasChanges && confirm(message)) {
                        shops = allShops;
                        routeSummaries.clear();
                        routeRankingToken++;
                        showShops();
                        document.getElementById('updateTime').textContent =
                            '数据更新: ' + new Date().toLocaleString('zh-CN') + '（共 ' + shops.length + ' 家）';
                        alert('更新完成，当前共 ' + shops.length + ' 家商家');
                    } else if (!hasChanges) {
                        alert(message);
                    }
                })
                .catch(error => {
                    console.error('更新失败:', error);
                    alert('更新失败，请检查网络连接');
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = '更新商家';
                    loading.classList.add('hidden');
                });
        }

        async function fetchAllLatestShops() {
            const allShops = [];
            let page = 1;
            const limit = 10;

            while (true) {
                const params = { ...API_PARAMS, page, limit };
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json, text/plain, */*',
                        'Accept-Language': 'zh-CN,zh;q=0.9',
                        'Content-Type': 'application/json;charset=UTF-8',
                        'Origin': 'https://chfwb.meiqitc.com',
                        'Referer': 'https://chfwb.meiqitc.com/mqstatic/1010100/',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify(params)
                });

                const data = await response.json();
                if (data.code !== '0' || !data.data?.data || data.data.data.length === 0) {
                    break;
                }

                data.data.data.forEach(shop => {
                    const [lng, lat] = (shop.lonLat || ',').split(',').map(Number);
                    allShops.push({
                        name: shop.storeName || '',
                        address: shop.address || '',
                        phone: shop.phone || '',
                        workTime: shop.storeBusinessTime || shop.businessTime || '',
                        lat: Number.isFinite(lat) ? lat : 0,
                        lng: Number.isFinite(lng) ? lng : 0
                    });
                });

                if (data.data.data.length < limit) {
                    break;
                }

                page++;
            }

            return allShops;
        }

        function compareShops(oldShops, newShops) {
            const oldMap = new Map(oldShops.map(shop => [shop.name, shop]));
            const newMap = new Map(newShops.map(shop => [shop.name, shop]));

            const added = [];
            const removed = [];
            const updated = [];

            newShops.forEach(newShop => {
                const oldShop = oldMap.get(newShop.name);
                if (!oldShop) {
                    added.push(newShop);
                    return;
                }

                if (oldShop.address !== newShop.address ||
                    oldShop.phone !== newShop.phone ||
                    oldShop.workTime !== newShop.workTime ||
                    oldShop.lat !== newShop.lat ||
                    oldShop.lng !== newShop.lng) {
                    updated.push({ name: newShop.name, old: oldShop, new: newShop });
                }
            });

            oldShops.forEach(oldShop => {
                if (!newMap.has(oldShop.name)) {
                    removed.push(oldShop);
                }
            });

            return { added, removed, updated };
        }

        function getShopKey(shop) {
            return shop.name + '|' + shop.address + '|' + shop.lng + ',' + shop.lat;
        }

        function calculateDistance(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLng/2) * Math.sin(dLng/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function formatDistance(km) {
            if (!Number.isFinite(km)) {
                return '';
            }
            if (km < 1) {
                return Math.round(km * 1000) + '米';
            }
            return km.toFixed(1) + '公里';
        }

        function wgs84ToGcj02(lng, lat) {
            if (outOfChina(lng, lat)) {
                return { lng, lat };
            }

            const pi = 3.1415926535897932384626;
            const a = 6378245.0;
            const ee = 0.00669342162296594323;
            let dLat = transformLat(lng - 105.0, lat - 35.0);
            let dLng = transformLng(lng - 105.0, lat - 35.0);
            const radLat = lat / 180.0 * pi;
            let magic = Math.sin(radLat);
            magic = 1 - ee * magic * magic;
            const sqrtMagic = Math.sqrt(magic);
            dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * pi);
            dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * pi);
            return {
                lng: lng + dLng,
                lat: lat + dLat
            };
        }

        function transformLat(lng, lat) {
            let ret = -100.0 + 2.0 * lng + 3.0 * lat + 0.2 * lat * lat + 0.1 * lng * lat + 0.2 * Math.sqrt(Math.abs(lng));
            ret += (20.0 * Math.sin(6.0 * lng * Math.PI) + 20.0 * Math.sin(2.0 * lng * Math.PI)) * 2.0 / 3.0;
            ret += (20.0 * Math.sin(lat * Math.PI) + 40.0 * Math.sin(lat / 3.0 * Math.PI)) * 2.0 / 3.0;
            ret += (160.0 * Math.sin(lat / 12.0 * Math.PI) + 320 * Math.sin(lat * Math.PI / 30.0)) * 2.0 / 3.0;
            return ret;
        }

        function transformLng(lng, lat) {
            let ret = 300.0 + lng + 2.0 * lat + 0.1 * lng * lng + 0.1 * lng * lat + 0.1 * Math.sqrt(Math.abs(lng));
            ret += (20.0 * Math.sin(6.0 * lng * Math.PI) + 20.0 * Math.sin(2.0 * lng * Math.PI)) * 2.0 / 3.0;
            ret += (20.0 * Math.sin(lng * Math.PI) + 40.0 * Math.sin(lng / 3.0 * Math.PI)) * 2.0 / 3.0;
            ret += (150.0 * Math.sin(lng / 12.0 * Math.PI) + 300.0 * Math.sin(lng / 30.0 * Math.PI)) * 2.0 / 3.0;
            return ret;
        }

        function outOfChina(lng, lat) {
            return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271;
        }

        function escapeHtml(value) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            };
            return String(value || '').replace(/[&<>"']/g, char => map[char]);
        }

        function encodedValue(value) {
            return encodeURIComponent(String(value || ''));
        }

        document.addEventListener('click', handleInfoWindowAction, true);
        document.addEventListener('touchend', handleInfoWindowAction, { capture: true, passive: false });

        window.onload = initMap;
    </script>
